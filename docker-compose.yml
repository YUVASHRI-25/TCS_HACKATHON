# Optional. TRACE runs with zero external services (networkx + sqlite + LLM_PROVIDER=none).
services:
  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
    ports: ["7474:7474", "7687:7687"]
    profiles: ["neo4j"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    ports: ["5432:5432"]
    profiles: ["postgres"]
  backend:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes: [".:/app"]
    env_file: [".env"]
    command: sh -c "pip install -e . && python ../scripts/run_pipeline.py && uvicorn trace.api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    volumes: [".:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
