[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-aml"
version = "0.1.0"
description = "TRACE - Transaction Relationship Analysis & Crime Exploration (decision support only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "pandas>=2.1",
  "pyarrow>=15",
  "pyyaml>=6",
  "networkx>=3.2",
  "python-louvain>=0.16",
  "rapidfuzz>=3.6",
  "scikit-learn>=1.4",
  "reportlab>=4.1",
  "sse-starlette>=2.0",
  "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
llm = ["google-genai", "anthropic", "openai"]
ml = ["lightgbm", "shap", "torch"]
rag = ["sentence-transformers", "faiss-cpu"]
neo4j = ["neo4j>=5"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["trace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
